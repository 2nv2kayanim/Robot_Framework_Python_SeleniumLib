[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "group-benefits-robot-portfolio"
version = "1.0.0"
description = "A local-only Robot Framework and SeleniumLibrary portfolio test project."
requires-python = ">=3.11"
dependencies = [
    "allure-robotframework==2.16.2",
    "flask==3.1.3",
    "robotframework==7.5",
    "robotframework-seleniumlibrary==6.9.0",
    "selenium==4.52.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pip-tools==7.6.2",
    "pytest==9.2.0",
    "robotframework-robocop==9.1.2",
    "robotframework-tidy==4.18.0",
    "ruff==0.17.3",
]

[tool.setuptools]
packages = ["libraries", "mock_portal", "config"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["libraries", "mock_portal", "config", "tests_unit"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["robot.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests_unit"]
addopts = "-ra"
